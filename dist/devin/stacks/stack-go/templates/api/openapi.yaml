openapi: 3.0.3
info: { title: Citados API, version: 0.1.0 }
components:
  securitySchemes:
    cognito: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 200 }
        status: { type: integer }
        code: { type: string, maxLength: 64 }
        requestId: { type: string, maxLength: 64 }
    RecordGoal:
      type: object
      additionalProperties: false
      required: [playerId, minute, clientEventId]
      properties:
        playerId: { type: string, format: uuid }
        minute: { type: integer, minimum: 0, maximum: 130 }
        clientEventId: { type: string, format: uuid }
    Goals:
      type: object
      additionalProperties: false
      required: [matchId, goals, replay]
      properties:
        matchId: { type: string, format: uuid }
        goals: { type: integer }
        replay: { type: boolean }
security: [{ cognito: [] }]
paths:
  /matches/{id}/goals:
    post:
      operationId: recordGoal
      security: [{ cognito: [coach, delegate] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecordGoal' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Goals' } } } }
        default: { description: error, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /live/{token}:
    get:
      operationId: liveBoard
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, maxLength: 43 } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Goals' } } } }
