# Plantilla de stack-go: Postgres local que imita a Aurora DSQL en lo que se
# puede (Repeatable Read, UTC, collation C). Sin contraseña (trust) y solo en
# 127.0.0.1: DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
name: app-local

services:
  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - default_transaction_isolation=repeatable read
      - -c
      - timezone=UTC
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
