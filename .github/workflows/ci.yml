name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: hooks · sintaxis y e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis de los hooks
        run: |
          for f in source/core/hooks/*.sh source/core/tests/*.sh; do
            bash -n "$f" || exit 1
            echo "ok  $f"
          done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error source/core/hooks/*.sh source/core/tests/*.sh

      - name: E2E de los hooks sobre un repo real
        run: bash source/core/tests/e2e.sh

  build:
    name: build · sin drift y sin tokens de vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: La salida commiteada coincide con source/
        run: node bin/atk build --check

      - name: source/ no nombra a ningun agente concreto
        run: |
          # Las unicas menciones permitidas son las de compatibilidad en los hooks
          # (CLAUDE_PLUGIN_OPTION_*, CLAUDE_PROJECT_DIR, .claude/ como fallback) y
          # la lista de trailers prohibidos de delivery-workflow.
          if grep -rInE 'CLAUDE\.md|\$\{CLAUDE_PLUGIN_ROOT\}|/sdd-tdd-core:' source --include='*.md'; then
            echo "token de vendor en source/: usa un placeholder de adapters/targets.json"
            exit 1
          fi
          echo "ok  sin tokens de vendor"

      - name: JSON valido
        run: |
          for f in .claude-plugin/marketplace.json \
                   adapters/targets.json \
                   source/*/manifest.json \
                   plugins/*/.claude-plugin/plugin.json \
                   plugins/sdd-tdd-core/hooks/hooks.json; do
            jq empty "$f" || exit 1
            echo "ok  $f"
          done

      - name: Cada hook declarado existe y es ejecutable
        run: |
          jq -r '.hooks[][] | .hooks[].command' plugins/sdd-tdd-core/hooks/hooks.json \
            | sed 's|.*/hooks/||; s|"$||' \
            | while read -r s; do
                test -x "plugins/sdd-tdd-core/hooks/$s" || { echo "falta o no ejecutable: $s"; exit 1; }
                echo "ok  $s"
              done

      - name: El marketplace apunta a plugins que existen
        run: |
          jq -r '.plugins[].source' .claude-plugin/marketplace.json \
            | while read -r p; do
                test -f "$p/.claude-plugin/plugin.json" || { echo "plugin inexistente: $p"; exit 1; }
                echo "ok  $p"
              done
